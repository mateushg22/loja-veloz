name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias, Linter (Ruff) e Testes (Pytest)
      run: |
        pip install -r requirements.txt
        ruff check .
        pytest -v

    - name: Build da Imagem Docker
      run: |
        docker build -t ghcr.io/loja-veloz/pedidos:${{ github.sha }} .
