apiVersion: v1
kind: Namespace
metadata:
  name: loja-veloz
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pedidos-config
  namespace: loja-veloz
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: pedidos-secret
  namespace: loja-veloz
type: Opaque
stringData:
  DB_USER: "user_veloz"
  DB_PASSWORD: "secret_password"
