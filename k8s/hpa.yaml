apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: servico-pedidos-hpa
  namespace: loja-veloz
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: servico-pedidos
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
